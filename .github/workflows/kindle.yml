name: Send lessons to Kindle

# Every Sunday evening, mail one EPUB with the week's lessons to the reader's
# Send-to-Kindle address. Run by hand with mode=books to send one catch-up
# volume per track containing every lesson written so far.
#
# Secrets (Settings → Secrets and variables → Actions):
#   KINDLE_EMAIL    the @kindle.com address (Amazon: Manage Your Content and
#                   Devices → Preferences → Personal Document Settings)
#   MAIL_FROM       the sending address; it must be on Amazon's approved
#                   personal document e-mail list, same page as above
#   SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD
#                   any SMTP account that can send as MAIL_FROM (Gmail with an
#                   app password: smtp.gmail.com, 465)
# Without KINDLE_EMAIL the workflow does nothing.

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "week (this week's lessons) or books (everything so far, one per track)"
        default: "week"
        required: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    if: ${{ vars.KINDLE_DISABLED != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build EPUB(s)
        id: build
        env:
          MODE: ${{ github.event.inputs.mode || 'week' }}
        run: |
          set -e
          mkdir -p out
          if [ "$MODE" = "books" ]; then
            node kindle-lessons.mjs --books --out out | tee out/list.txt
          else
            node kindle-lessons.mjs --week --out out | tee out/list.txt
          fi
          if [ -s out/list.txt ]; then echo "has_files=true" >> "$GITHUB_OUTPUT"; else echo "has_files=false" >> "$GITHUB_OUTPUT"; fi
          echo "subject=$(cut -f1 out/list.txt | head -1 | xargs -n1 basename | sed 's/\.epub$//')" >> "$GITHUB_OUTPUT"

      - name: Skip (nothing to send or no Kindle address)
        if: ${{ steps.build.outputs.has_files != 'true' || secrets.KINDLE_EMAIL == '' }}
        run: echo "Nothing to send, or KINDLE_EMAIL is not set."

      - name: Mail to Kindle
        if: ${{ steps.build.outputs.has_files == 'true' && secrets.KINDLE_EMAIL != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Daily Loop <${{ secrets.MAIL_FROM }}>
          to: ${{ secrets.KINDLE_EMAIL }}
          subject: ${{ steps.build.outputs.subject }}
          body: Daily Loop lessons, attached as EPUB.
          attachments: out/*.epub
